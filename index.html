<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate</title>
<style>
  :root {
    --spm-primary: #ea002a;
    --spm-accent:  #0031a1;
    --bg:          #f3f3f3;
    --text:        #1a1a1a;
    --muted:       #888;
    --card-radius: 22px;
    --pill-radius: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 32px 28px;
    max-width: 460px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    text-align: center;
  }
  .head {
    background: linear-gradient(135deg, var(--spm-primary), var(--spm-accent));
    color: #fff;
    border-radius: var(--card-radius);
    padding: 20px 16px;
    margin: -32px -28px 24px;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  p { margin: 0 0 12px; line-height: 1.5; color: #444; font-size: 0.95rem; }
  code { background: #eef1f7; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; color: var(--spm-accent); font-weight: 700; }
  .go {
    display: inline-block;
    margin-top: 8px;
    padding: 12px 28px;
    border-radius: var(--pill-radius);
    background: var(--spm-accent);
    color: #fff;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .go:hover { opacity: 0.88; }
</style>
</head>
<body>
<div class="card">
  <div class="head" id="appNameHead">Slate</div>
  <p>This is an admin-only tool. Use your bookmarked URL with the service-role key, or append <code>?key=&lt;service_role&gt;</code> to the admin URL.</p>
  <a class="go" href="admin.html">Go to Admin →</a>
</div>
<script>
  // Single-source-of-truth rebrand: change APP_NAME to rename everywhere.
  const APP_NAME = 'Slate';
  document.title = APP_NAME;
  document.getElementById('appNameHead').textContent = APP_NAME;
</script>
</body>
</html>
